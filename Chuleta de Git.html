<title>Chuleta de Git</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: columna de lectura con índice lateral fijo en escritorio; los comandos son la pieza principal y llevan copiar. */
:root {
  --bg: #F4F6F7;
  --surface: #FFFFFF;
  --ink: #16202A;
  --muted: #55636F;
  --line: #DAE1E6;
  --accent: #0A6B66;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFED;
  --code-bg: #EAEFF2;
  --warn: #8F4A06;
  --warn-soft: #FBEAD2;
  --danger: #A3302A;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B;
    --surface: #151E26;
    --ink: #E5ECF1;
    --muted: #94A2AE;
    --line: #25323D;
    --accent: #4CC3B8;
    --accent-ink: #06201D;
    --accent-soft: #123430;
    --code-bg: #1B2731;
    --warn: #E8A95B;
    --warn-soft: #3B2A13;
    --danger: #F09189;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B;
  --surface: #151E26;
  --ink: #E5ECF1;
  --muted: #94A2AE;
  --line: #25323D;
  --accent: #4CC3B8;
  --accent-ink: #06201D;
  --accent-soft: #123430;
  --code-bg: #1B2731;
  --warn: #E8A95B;
  --warn-soft: #3B2A13;
  --danger: #F09189;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

.wrap { max-width: 1080px; margin: 0 auto; }

/* Cabecera */
.hero { padding-block: 40px 20px; }
.hero h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2.1rem, 6vw, 3.2rem);
  line-height: 1.02;
  letter-spacing: -0.02em;
  margin: 0 0 10px;
  text-wrap: balance;
}
.hero p { margin: 0; color: var(--muted); max-width: 62ch; }
.hero .count { margin-top: 12px; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }

/* Buscador fijo */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding-block: 10px;
  border-bottom: 1px solid var(--line);
}
.search { position: relative; max-width: 560px; }
.search input {
  width: 100%;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 14px;
}
.search input::placeholder { color: var(--muted); }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Estructura */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; margin-top: 20px; }
.nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.nav a {
  flex: none;
  color: var(--ink);
  text-decoration: none;
  font-size: 13.5px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  white-space: nowrap;
}
.nav a:hover { border-color: var(--accent); }
.nav a[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (min-width: 900px) {
  .layout { grid-template-columns: 210px minmax(0, 1fr); gap: 40px; }
  .nav {
    flex-direction: column;
    gap: 2px;
    overflow: visible;
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 74px);
    align-self: start;
    max-height: calc(100vh - 96px);
    overflow-y: auto;
    padding-bottom: 0;
  }
  .nav a { border: 0; border-radius: 6px; background: transparent; padding: 6px 10px; white-space: normal; }
  .nav a[aria-current="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
}

main { min-width: 0; }
section { margin-bottom: 44px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 70px); }
h2 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.45rem;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
  text-wrap: balance;
}
h2 .num { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 500; color: var(--muted); }
.chip {
  font-family: var(--font-body);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 4px;
  padding: 2px 8px;
}
.chip.warn { color: var(--warn); background: var(--warn-soft); }

/* Flujo diario */
.flow { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.step {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.step .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.step .what { color: var(--muted); font-size: 14px; }
.step .cmd { flex-direction: column; align-items: flex-start; }
.step .cmd code.c { align-self: stretch; flex: none; }
@media (min-width: 700px) {
  .step:not(:last-child)::after {
    content: "→";
    position: absolute;
    right: -12px; top: 50%;
    transform: translate(50%, -50%);
    color: var(--accent);
    font-family: var(--font-mono);
    font-weight: 500;
    background: var(--bg);
    padding: 0 2px;
    z-index: 1;
  }
}
@media (max-width: 899px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .flow { grid-template-columns: minmax(0, 1fr); } }
.callout {
  margin-top: 14px;
  background: var(--accent-soft);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 14px;
}
.callout code { font-family: var(--font-mono); font-size: 13px; }

/* Conceptos */
.terms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; margin: 12px 0 0; }
.term { padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.term dt { font-weight: 600; }
.term dd { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
@media (max-width: 699px) { .terms { grid-template-columns: minmax(0, 1fr); } }

/* Filas de comandos */
.rows { margin-top: 10px; border-top: 1px solid var(--line); }
.row {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: 6px 24px;
  align-items: start;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}
@media (max-width: 699px) { .row { grid-template-columns: minmax(0, 1fr); } }
.cmd { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
code.c {
  flex: 1 1 auto;
  min-width: 0;
  font-family: var(--font-mono);
  font-size: 13.5px;
  line-height: 1.5;
  background: var(--code-bg);
  border-radius: 6px;
  padding: 6px 10px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
button.copy {
  flex: none;
  font: inherit;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
  min-width: 74px;
}
button.copy:hover { border-color: var(--accent); }
button.copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.copy.ok { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.desc { margin: 0; color: var(--muted); font-size: 14.5px; padding-top: 5px; }
.desc .chip { margin-left: 6px; vertical-align: 1px; }

.notes { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.notes p { margin: 0; font-size: 14px; color: var(--muted); max-width: 72ch; }
.notes pre {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 13px;
  background: var(--code-bg);
  border-radius: 6px;
  padding: 10px 12px;
  overflow-x: auto;
}

/* Errores */
.errs { margin-top: 10px; border-top: 1px solid var(--line); }
.err { padding: 16px 0; border-bottom: 1px solid var(--line); display: grid; gap: 6px; min-width: 0; }
.err .e { font-family: var(--font-mono); font-size: 13.5px; font-weight: 500; color: var(--danger); overflow-wrap: anywhere; }
.err .why { margin: 0; color: var(--muted); font-size: 14.5px; }
.err .fixes { display: grid; gap: 6px; margin-top: 4px; }
.err .fixes .cmd { max-width: 640px; }
.err .none { font-size: 14px; color: var(--accent); }
.err .nota { margin: 2px 0 0; font-size: 13.5px; color: var(--warn); }

.empty { padding: 28px 0; color: var(--muted); }
[hidden] { display: none !important; }
</style>

    <main id="main"></main>

</div>

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

// Copiar: portapapeles si se puede; si no, se selecciona el texto
function copyText(text, btn, codeEl) {
  const done = () => {
    const old = btn.textContent;
    btn.textContent = "Copiado";
    btn.classList.add("ok");
    setTimeout(() => { btn.textContent = "Copiar"; btn.classList.remove("ok"); }, 1300);
  };
  const fallback = () => {
    try {
      const r = document.createRange();
      r.selectNodeContents(codeEl);
      const s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      btn.textContent = "Selecciona";
      setTimeout(() => { btn.textContent = "Copiar"; }, 1500);
    } catch (e) {}
  };
  try {
    navigator.clipboard.writeText(text).then(done, fallback);
  } catch (e) { fallback(); }
}

function cmdBlock(text) {
  const wrap = el("div", "cmd");
  const code = el("code", "c", text);
  const btn = el("button", "copy", "Copiar");
  btn.type = "button";
  btn.setAttribute("aria-label", "Copiar: " + text);
  btn.addEventListener("click", () => copyText(text, btn, code));
  wrap.append(code, btn);
  return wrap;
}

// Título y contador
document.getElementById("t").textContent = D.title;
document.getElementById("sub").textContent = D.subtitle;
const totalCmds = D.sections.reduce((a, s) => a + s.rows.length, 0);
document.getElementById("count").textContent =
  totalCmds + " comandos · " + D.sections.length + " categorías · " + D.errors.length + " errores resueltos";

const main = document.getElementById("main");
const nav = document.getElementById("nav");
const sectionEls = [];

function addSection(id, titleText, num, tag, warnTag) {
  const s = el("section");
  s.id = id;
  const h = el("h2");
  if (num) h.append(el("span", "num", num));
  h.append(document.createTextNode(titleText));
  if (tag) h.append(el("span", warnTag ? "chip warn" : "chip", tag));
  s.append(h);
  main.append(s);
  sectionEls.push(s);
  const a = el("a", null, titleText);
  a.href = "#" + id;
  a.dataset.target = id;
  nav.append(a);
  return s;
}

// Flujo de cada día
{
  const s = addSection("flujo", "Flujo de cada día", "", "Lo más usado", false);
  const ol = el("ol", "flow");
  D.flow.forEach((f, i) => {
    const li = el("li", "step");
    li.dataset.s = (f[0] + " " + f[1]).toLowerCase();
    li.append(el("span", "n", "Paso " + (i + 1)));
    li.append(cmdBlock(f[0]));
    li.append(el("span", "what", f[1]));
    ol.append(li);
  });
  s.append(ol);
  const c = el("div", "callout", D.flowNote);
  s.append(c);
}

// Conceptos
{
  const s = addSection("conceptos", "Conceptos clave", "", "", false);
  const dl = el("dl", "terms");
  D.concepts.forEach(([t, x]) => {
    const d = el("div", "term");
    d.dataset.s = (t + " " + x).toLowerCase();
    d.append(el("dt", null, t), el("dd", null, x));
    dl.append(d);
  });
  s.append(dl);
}

// Categorías
D.sections.forEach((sec, i) => {
  const s = addSection(sec.id, sec.title, String(i + 1).padStart(2, "0"), sec.tag, false);
  const rows = el("div", "rows");
  sec.rows.forEach(r => {
    const row = el("div", "row");
    row.dataset.s = (r.c + " " + r.d).toLowerCase();
    row.append(cmdBlock(r.c));
    const d = el("p", "desc", r.d);
    if (r.w) d.append(el("span", "chip warn", "Cuidado"));
    row.append(d);
    rows.append(row);
  });
  s.append(rows);
  if (sec.notes && sec.notes.length) {
    const box = el("div", "notes");
    let pre = null;
    sec.notes.forEach(n => {
      if (n.startsWith("    ")) {
        if (!pre) { pre = el("pre"); box.append(pre); pre.textContent = n.slice(4); }
        else pre.textContent += "\n" + n.slice(4);
      } else {
        pre = null;
        box.append(el("p", null, n));
      }
    });
    box.dataset.keep = "1";
    s.append(box);
  }
});

// Errores
{
  const s = addSection("errores", "Errores frecuentes y cómo solucionarlos", String(D.sections.length + 1).padStart(2, "0"), "", false);
  const list = el("div", "errs");
  D.errors.forEach(e => {
    const it = el("div", "err");
    it.dataset.s = (e.err + " " + e.why + " " + (e.fix || []).join(" ")).toLowerCase();
    it.append(el("div", "e", e.err));
    it.append(el("p", "why", e.why));
    if (e.fix && e.fix.length) {
      const f = el("div", "fixes");
      e.fix.forEach(c => f.append(cmdBlock(c)));
      it.append(f);
    } else {
      it.append(el("div", "none", "No hay que hacer nada: es normal."));
    }
    if (e.note) it.append(el("p", "nota", e.note));
    list.append(it);
  });
  s.append(list);
}

const empty = el("div", "empty", "No hay resultados. Prueba con otra palabra.");
empty.hidden = true;
main.append(empty);

// Buscador
const q = document.getElementById("q");
function filter() {
  const t = q.value.trim().toLowerCase();
  let any = false;
  sectionEls.forEach(sec => {
    const items = sec.querySelectorAll("[data-s]");
    let shown = 0;
    items.forEach(it => {
      const ok = !t || it.dataset.s.includes(t);
      it.hidden = !ok;
      if (ok) shown++;
    });
    const notes = sec.querySelector("[data-keep]");
    if (notes) notes.hidden = !!t;
    sec.hidden = !!t && shown === 0;
    if (!sec.hidden) any = true;
    const link = nav.querySelector('[data-target="' + sec.id + '"]');
    if (link) link.hidden = sec.hidden;
  });
  empty.hidden = any;
}
q.addEventListener("input", filter);

// Índice: salto suave y sección activa
const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
nav.addEventListener("click", ev => {
  const a = ev.target.closest("a");
  if (!a) return;
  ev.preventDefault();
  const sec = document.getElementById(a.dataset.target);
  if (sec) sec.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
});
if ("IntersectionObserver" in window) {
  const links = Array.from(nav.querySelectorAll("a"));
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        links.forEach(l => l.removeAttribute("aria-current"));
        const l = nav.querySelector('[data-target="' + en.target.id + '"]');
        if (l) l.setAttribute("aria-current", "true");
      }
    });
  }, { rootMargin: "-80px 0px -65% 0px" });
  sectionEls.forEach(s => io.observe(s));
}
</script>
